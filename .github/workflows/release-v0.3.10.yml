name: Release Studio Color QC v0.3.10

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    if: contains(github.event.head_commit.message, '[release v0.3.10]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Siapkan Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Siapkan Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Siapkan Rust dan Target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Tentukan Lokasi NDK
        id: ndk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_DIR=$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n 1)
          elif [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          else
            NDK_DIR="$ANDROID_NDK_ROOT"
          fi
          echo "Memakai NDK di: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Pasang Dependensi Frontend
        run: npm ci

      - name: Jalankan Seluruh Tes Sains Warna & Bridge
        run: npm test

      - name: Build Frontend
        run: npm run build

      - name: Inisialisasi dan Kompilasi APK Android Pilot
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          npx --yes @tauri-apps/cli@2.11.4 android build --apk --debug --target aarch64

      - name: Cari dan Siapkan Berkas APK
        id: find_apk
        run: |
          APK_FILE=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Berkas APK tidak ditemukan!"
            exit 1
          fi
          echo "APK Ditemukan: $APK_FILE"
          mkdir -p artifacts
          cp "$APK_FILE" artifacts/Studio-Color-QC-v0.3.10-Android-Pilot.apk
          ls -lh artifacts/

      - name: Unggah Artefak APK Android
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-v0.3.10
          path: artifacts/Studio-Color-QC-v0.3.10-Android-Pilot.apk
          retention-days: 1

  release-windows:
    needs: [build-android-apk]
    if: contains(github.event.head_commit.message, '[release v0.3.10]') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Siapkan Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verifikasi versi sumber
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($package.version -ne "0.3.10") { throw "package.json bukan v0.3.10" }
          if ($tauri.version -ne "0.3.10") { throw "tauri.conf.json bukan v0.3.10" }

      - name: Pasang dependensi frontend
        run: npm ci

      - name: Uji frontend dan regresi image-fit
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Uji Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Periksa Rust core
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build installer standar ringan
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Installer standar v0.3.10 tidak ditemukan." }
          $asset = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.10-Windows-x64-Setup.exe"
          Copy-Item $installer.FullName $asset -Force
          if ((Get-Item $asset).Length -gt 60MB) {
            throw "Installer standar terlalu besar. WebView2 offline kemungkinan ikut terbungkus tanpa sengaja."
          }

      - name: Uji upgrade-in-place v0.3.9 ke v0.3.10 dan launch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $newInstaller = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.10-Windows-x64-Setup.exe"
          $oldDir = Join-Path $env:RUNNER_TEMP "old-release"
          New-Item -ItemType Directory -Force -Path $oldDir | Out-Null
          gh release download "v0.3.9" --repo "$env:GITHUB_REPOSITORY" --pattern "Studio-Color-QC-v0.3.9-Windows-x64-Setup.exe" --dir "$oldDir"
          $oldInstaller = Get-ChildItem -Path $oldDir -Filter "*.exe" -File | Select-Object -First 1
          if (-not $oldInstaller) { throw "Installer v0.3.9 tidak berhasil diunduh." }

          $oldProcess = Start-Process -FilePath $oldInstaller.FullName -ArgumentList "/S" -Wait -PassThru -WindowStyle Hidden
          if ($oldProcess.ExitCode -ne 0) { throw "Instalasi v0.3.9 gagal: $($oldProcess.ExitCode)" }
          $newProcess = Start-Process -FilePath $newInstaller -ArgumentList "/S" -Wait -PassThru -WindowStyle Hidden
          if ($newProcess.ExitCode -ne 0) { throw "Instalasi v0.3.10 gagal: $($newProcess.ExitCode)" }

          $entries = @(Get-ItemProperty @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          ) -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq "Studio Color QC" })
          if ($entries.Count -ne 1) { throw "Upgrade harus menyisakan tepat 1 instalasi, ditemukan $($entries.Count)." }
          if ($entries[0].DisplayVersion -ne "0.3.10") { throw "Versi registry bukan 0.3.10." }

          $installLocation = $entries[0].InstallLocation
          $exe = $null
          if ($installLocation -and (Test-Path $installLocation)) {
            $exe = Get-ChildItem -Path $installLocation -Filter "studio-color-qc.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA" -Filter "studio-color-qc.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) { throw "EXE hasil instalasi tidak ditemukan untuk smoke launch." }

          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 6
          if ($app.HasExited) { throw "Aplikasi keluar terlalu cepat setelah launch. ExitCode=$($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Write-Host "PASS: upgrade-in-place dan smoke launch v0.3.10 berhasil."

      - name: Build installer Offline Full
        shell: pwsh
        run: |
          Remove-Item "src-tauri/target/release/bundle/nsis/*.exe" -Force -ErrorAction SilentlyContinue
          npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis --config src-tauri/tauri.offline.conf.json
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Installer Offline Full v0.3.10 tidak ditemukan." }
          $asset = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.10-Windows-x64-Offline-Full-Setup.exe"
          Copy-Item $installer.FullName $asset -Force

      - name: Unduh Artefak APK Android
        uses: actions/download-artifact@v4
        with:
          name: android-apk-v0.3.10
          path: ${{ runner.temp }}

      - name: Publikasikan GitHub Release v0.3.10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $standard = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.10-Windows-x64-Setup.exe"
          $offline = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.10-Windows-x64-Offline-Full-Setup.exe"
          $apk = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.10-Android-Pilot.apk"
          if (-not (Test-Path $standard)) { throw "Aset installer standar tidak ditemukan." }
          if (-not (Test-Path $offline)) { throw "Aset installer offline tidak ditemukan." }
          if (-not (Test-Path $apk)) { throw "Aset APK Android tidak ditemukan." }
          gh release create "v0.3.10" "$standard" "$offline" "$apk" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Studio Color QC v0.3.10 - Photo Fit Fix & Android Pilot" --notes-file "RELEASE_v0.3.10.md"
