name: Windows Installer Smoke Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/windows-white-blank-v0.3.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Siapkan Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Pasang dependensi frontend
        run: npm ci

      - name: Uji frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Uji Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Periksa Rust core
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build installer NSIS standar
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis

      - name: Pastikan installer terbentuk dan tetap ringan
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "Installer NSIS tidak ditemukan."
          }
          if ($installer.Length -gt 60MB) {
            throw "Installer standar terlalu besar ($([math]::Round($installer.Length / 1MB, 1)) MB). Periksa apakah WebView2 offline ikut terbungkus."
          }
          Write-Host "Installer standar terverifikasi: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 1)) MB)"

      - name: Simpan installer hasil smoke test
        uses: actions/upload-artifact@v4
        with:
          name: studio-color-qc-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
