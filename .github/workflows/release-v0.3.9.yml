name: Release Studio Color QC v0.3.9

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: contains(github.event.head_commit.message, '[release v0.3.9]') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Siapkan Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verifikasi versi sumber
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($package.version -ne "0.3.9") { throw "package.json bukan v0.3.9" }
          if ($tauri.version -ne "0.3.9") { throw "tauri.conf.json bukan v0.3.9" }

      - name: Pasang dependensi frontend
        run: npm ci

      - name: Uji frontend dan regresi image-fit
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Uji Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Periksa Rust core
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build installer standar ringan
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Installer standar v0.3.9 tidak ditemukan." }
          $asset = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.9-Windows-x64-Setup.exe"
          Copy-Item $installer.FullName $asset -Force
          if ((Get-Item $asset).Length -gt 60MB) {
            throw "Installer standar terlalu besar. WebView2 offline kemungkinan ikut terbungkus tanpa sengaja."
          }

      - name: Uji upgrade-in-place v0.3.8 ke v0.3.9 dan launch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $newInstaller = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.9-Windows-x64-Setup.exe"
          $oldDir = Join-Path $env:RUNNER_TEMP "old-release"
          New-Item -ItemType Directory -Force -Path $oldDir | Out-Null
          gh release download "v0.3.8" --repo "$env:GITHUB_REPOSITORY" --pattern "Studio-Color-QC-v0.3.8-Windows-x64-Setup.exe" --dir "$oldDir"
          $oldInstaller = Get-ChildItem -Path $oldDir -Filter "*.exe" -File | Select-Object -First 1
          if (-not $oldInstaller) { throw "Installer v0.3.8 tidak berhasil diunduh." }

          $oldProcess = Start-Process -FilePath $oldInstaller.FullName -ArgumentList "/S" -Wait -PassThru -WindowStyle Hidden
          if ($oldProcess.ExitCode -ne 0) { throw "Instalasi v0.3.8 gagal: $($oldProcess.ExitCode)" }
          $newProcess = Start-Process -FilePath $newInstaller -ArgumentList "/S" -Wait -PassThru -WindowStyle Hidden
          if ($newProcess.ExitCode -ne 0) { throw "Instalasi v0.3.9 gagal: $($newProcess.ExitCode)" }

          $entries = @(Get-ItemProperty @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          ) -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq "Studio Color QC" })
          if ($entries.Count -ne 1) { throw "Upgrade harus menyisakan tepat 1 instalasi, ditemukan $($entries.Count)." }
          if ($entries[0].DisplayVersion -ne "0.3.9") { throw "Versi registry bukan 0.3.9." }

          $installLocation = $entries[0].InstallLocation
          $exe = $null
          if ($installLocation -and (Test-Path $installLocation)) {
            $exe = Get-ChildItem -Path $installLocation -Filter "studio-color-qc.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA" -Filter "studio-color-qc.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) { throw "EXE hasil instalasi tidak ditemukan untuk smoke launch." }

          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 6
          if ($app.HasExited) { throw "Aplikasi keluar terlalu cepat setelah launch. ExitCode=$($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Write-Host "PASS: upgrade-in-place dan smoke launch v0.3.9 berhasil."

      - name: Build installer Offline Full
        shell: pwsh
        run: |
          Remove-Item "src-tauri/target/release/bundle/nsis/*.exe" -Force -ErrorAction SilentlyContinue
          npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis --config src-tauri/tauri.offline.conf.json
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Installer Offline Full v0.3.9 tidak ditemukan." }
          $asset = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.9-Windows-x64-Offline-Full-Setup.exe"
          Copy-Item $installer.FullName $asset -Force

      - name: Publikasikan GitHub Release v0.3.9
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $standard = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.9-Windows-x64-Setup.exe"
          $offline = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.9-Windows-x64-Offline-Full-Setup.exe"
          if (-not (Test-Path $standard)) { throw "Aset installer standar tidak ditemukan." }
          if (-not (Test-Path $offline)) { throw "Aset installer offline tidak ditemukan." }
          gh release create "v0.3.9" "$standard" "$offline" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Studio Color QC v0.3.9 - Full Photo Fit Fix" --notes-file "RELEASE_v0.3.9.md"
