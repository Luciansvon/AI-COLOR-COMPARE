name: Release Studio Color QC v0.3.6

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: contains(github.event.head_commit.message, '[release v0.3.6]') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Siapkan Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Pasang dependensi frontend
        run: npm ci

      - name: Uji frontend dan regresi koreksi
        run: npm test

      - name: Uji analisis RGB operator
        run: npx tsx tests/rgb_analysis.test.ts

      - name: Build frontend
        run: npm run build

      - name: Uji Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Periksa Rust core
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build installer standar ringan
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Installer standar v0.3.6 tidak ditemukan." }

          $asset = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.6-Windows-x64-Setup.exe"
          Copy-Item $installer.FullName $asset -Force

          if ((Get-Item $asset).Length -gt 60MB) {
            throw "Installer standar terlalu besar. WebView2 offline kemungkinan ikut terbungkus tanpa sengaja."
          }

      - name: Uji upgrade-in-place dari v0.3.5 ke v0.3.6
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $newInstaller = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.6-Windows-x64-Setup.exe"
          if (-not (Test-Path $newInstaller)) { throw "Installer standar v0.3.6 tidak ditemukan." }

          $oldDir = Join-Path $env:RUNNER_TEMP "old-release"
          New-Item -ItemType Directory -Force -Path $oldDir | Out-Null
          gh release download "v0.3.5" --repo "$env:GITHUB_REPOSITORY" --pattern "Studio-Color-QC-v0.3.5-Windows-x64-Setup.exe" --dir "$oldDir"
          $oldInstaller = Get-ChildItem -Path $oldDir -Filter "*.exe" -File | Select-Object -First 1
          if (-not $oldInstaller) { throw "Installer pembanding v0.3.5 tidak berhasil diunduh." }

          $oldProcess = Start-Process -FilePath $oldInstaller.FullName -ArgumentList "/S" -Wait -PassThru -WindowStyle Hidden
          if ($oldProcess.ExitCode -ne 0) { throw "Instalasi v0.3.5 gagal: $($oldProcess.ExitCode)" }
          Start-Sleep -Seconds 2

          $newProcess = Start-Process -FilePath $newInstaller -ArgumentList "/S" -Wait -PassThru -WindowStyle Hidden
          if ($newProcess.ExitCode -ne 0) { throw "Instalasi v0.3.6 gagal: $($newProcess.ExitCode)" }
          Start-Sleep -Seconds 2

          $uninstallPaths = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )

          $entries = @(Get-ItemProperty $uninstallPaths -ErrorAction SilentlyContinue | Where-Object {
            $_.DisplayName -eq "Studio Color QC"
          })

          if ($entries.Count -ne 1) {
            $found = ($entries | ForEach-Object { "$($_.DisplayName) $($_.DisplayVersion)" }) -join "; "
            throw "Upgrade-in-place gagal: harus tepat 1 instalasi Studio Color QC, ditemukan $($entries.Count). $found"
          }

          if ($entries[0].DisplayVersion -ne "0.3.6") {
            throw "Upgrade-in-place gagal: versi registry $($entries[0].DisplayVersion), seharusnya 0.3.6."
          }

          Write-Host "PASS: v0.3.5 berhasil ditimpa menjadi v0.3.6 tanpa aplikasi kedua."

      - name: Build installer Offline Full
        shell: pwsh
        run: |
          Remove-Item "src-tauri/target/release/bundle/nsis/*.exe" -Force -ErrorAction SilentlyContinue
          npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis --config src-tauri/tauri.offline.conf.json
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Installer Offline Full v0.3.6 tidak ditemukan." }

          $asset = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.6-Windows-x64-Offline-Full-Setup.exe"
          Copy-Item $installer.FullName $asset -Force

      - name: Publikasikan GitHub Release v0.3.6
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $standard = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.6-Windows-x64-Setup.exe"
          $offline = Join-Path $env:RUNNER_TEMP "Studio-Color-QC-v0.3.6-Windows-x64-Offline-Full-Setup.exe"
          if (-not (Test-Path $standard)) { throw "Aset installer standar tidak ditemukan." }
          if (-not (Test-Path $offline)) { throw "Aset installer offline tidak ditemukan." }

          gh release create "v0.3.6" "$standard" "$offline" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Studio Color QC v0.3.6 - Preview & JPEG Correction Hotfix" --notes-file "RELEASE_v0.3.6.md"
