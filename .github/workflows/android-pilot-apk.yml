name: Build Android Pilot APK

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - '.github/workflows/android-pilot-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Siapkan Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Siapkan Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Siapkan Rust dan Target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Tentukan Lokasi NDK
        id: ndk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_DIR=$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n 1)
          elif [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          else
            NDK_DIR="$ANDROID_NDK_ROOT"
          fi
          echo "Memakai NDK di: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Pasang Dependensi Frontend
        run: npm ci

      - name: Jalankan Seluruh Tes Sains Warna & Bridge
        run: npm test

      - name: Build Frontend
        run: npm run build

      - name: Inisialisasi dan Kompilasi APK Android Pilot
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          npx --yes @tauri-apps/cli@2.11.4 android build --apk --debug --target aarch64

      - name: Cari dan Siapkan Berkas APK
        id: find_apk
        run: |
          APK_FILE=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Berkas APK tidak ditemukan!"
            exit 1
          fi
          echo "APK Ditemukan: $APK_FILE"
          mkdir -p artifacts
          cp "$APK_FILE" artifacts/Studio-Color-QC-v0.3.8-Android-Pilot.apk
          ls -lh artifacts/

      - name: Unggah Artefak APK Android
        uses: actions/upload-artifact@v4
        with:
          name: Studio-Color-QC-Android-Pilot-APK
          path: artifacts/Studio-Color-QC-v0.3.8-Android-Pilot.apk
          retention-days: 14
