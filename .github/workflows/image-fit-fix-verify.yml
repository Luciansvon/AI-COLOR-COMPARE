name: Apply Verified Full Photo Fit Fix

on:
  push:
    branches:
      - fix/image-fit-full-photo-v039

permissions:
  contents: write

jobs:
  apply-verified-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout branch fix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Terapkan patch fit foto yang sebelumnya sudah lolos build EXE
        run: python tools/apply_image_fit_fix.py

      - name: Pastikan viewer tidak memakai pola crop
        shell: pwsh
        run: |
          $viewer = Get-Content "src/components/qc/InteractiveImageViewer.tsx" -Raw
          if ($viewer -notmatch "calculateContainFit") { throw "Helper contain-fit tidak terpasang." }
          if ($viewer -notmatch "h-\[52vh\].*min-h-\[220px\].*max-h-\[460px\]") { throw "Frame belum memiliki tinggi eksplisit untuk perhitungan fit." }
          if ($viewer -match "max-h-\[50vh\].*sm:max-h-\[440px\]") { throw "Batas tinggi gambar lama masih aktif dan berisiko crop." }
          if ($viewer -match "object-cover") { throw "Viewer QC tidak boleh memakai object-cover." }
          Write-Host "PASS: contain-fit eksplisit aktif dan tidak ada object-cover."

      - name: Pasang dependensi frontend
        run: npm ci

      - name: Uji regresi frontend termasuk image-fit
        run: npm test

      - name: Build frontend production
        run: npm run build

      - name: Commit patch terverifikasi
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/qc/InteractiveImageViewer.tsx src/utils/imageFit.ts tests/image_fit.test.ts package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock RELEASE_v0.3.9.md
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan patch yang perlu di-commit."
            exit 0
          fi
          git commit -m "fix(ui): tampilkan foto utuh tanpa crop pada frame QC"
          git pull --rebase origin fix/image-fit-full-photo-v039
          git push origin HEAD:fix/image-fit-full-photo-v039
