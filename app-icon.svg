<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background rounded box -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#3d465c" stroke-width="12"/>
  
  <!-- Studio Master Panel Swatch -->
  <rect x="116" y="116" width="130" height="280" rx="20" fill="url(#amberGrad)" stroke="#fef3c7" stroke-width="6"/>
  <!-- Grain lines on master panel -->
  <path d="M140 136 Q 160 256 140 376" stroke="#92400e" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M170 136 Q 190 256 180 376" stroke="#92400e" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M210 136 Q 200 256 215 376" stroke="#92400e" stroke-width="4" fill="none" opacity="0.6"/>

  <!-- Product Swatch -->
  <rect x="266" y="116" width="130" height="280" rx="20" fill="#38bdf8" stroke="#e0f2fe" stroke-width="6"/>
  
  <!-- Checkmark shield -->
  <circle cx="256" cy="380" r="60" fill="#10b981" stroke="#059669" stroke-width="8"/>
  <path d="M236 380 L250 394 L280 364" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
